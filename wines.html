<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111613">
<title>PourMind — Open the wine library</title>
<style>body{margin:0;background:#111613;color:#f5f1e7;font:16px/1.6 system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center}main{padding:28px;max-width:440px}h1{font:38px/1.2 Georgia,serif}p{color:#b2b9ad}a,button{color:#111613;background:#e4bd78;border:0;border-radius:8px;padding:14px 20px;font:inherit;text-decoration:none;display:inline-block;cursor:pointer}a:focus-visible,button:focus-visible{outline:2px solid #f5f1e7;outline-offset:5px}[hidden]{display:none}</style>
</head>
<body><main><p>POURMIND</p><h1>Your wine library.</h1><p id="status" role="status">Opening the latest wine and spirit library…</p><p>Your saved recipes, bar and learning progress stay on this device.</p><button id="retry" hidden>Try again</button><noscript><p>Enable JavaScript, then reopen this page.</p></noscript></main>
<script>
'use strict';
const requested=new URLSearchParams(location.search).get('open');
const destination=['bar','library','wines','spirits'].includes(requested)?requested:'wines';
const opening=destination==='bar'?'Opening the latest My Bar…':destination==='library'?'Opening the latest Library…':'Opening the latest wine and spirit library…';
if(destination==='bar')document.querySelector('h1').textContent='Your personal bar.';
if(destination==='library')document.querySelector('h1').textContent='Your drink library.';
async function openLatest() {
  const retry=document.querySelector('#retry');retry.hidden=true;
  document.querySelector('#status').textContent=opening;
  try {
    // Require an online response before replacing downloaded application files.
    // This page has no cached JS dependencies, so it can recover an older installed app.
    const response=await fetch('./release.json?check='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw new Error('Update unavailable');
    const release=await response.json();if(typeof release.version!=='string'||!/^\d+\.\d+(?:\.\d+)?$/.test(release.version))throw new Error('Invalid release');
    const scope=new URL('./',location.href).href;
    if('serviceWorker' in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.filter(r=>r.scope===scope).map(r=>r.unregister()));}
    if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('pourmind-mobile-')).map(k=>caches.delete(k)));}
    location.replace('./?release='+encodeURIComponent(release.version)+'&fresh='+Date.now()+'#'+destination);
  } catch {
    document.querySelector('#status').textContent='Connect to the internet to open the latest PourMind, then try again.';
    retry.hidden=false;
  }
}
document.querySelector('#retry').addEventListener('click',openLatest);
openLatest();
</script>
</body>
</html>
